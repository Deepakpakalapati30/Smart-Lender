<!DOCTYPE html>
<html>
<head>
    <title>Smart Lender</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width:50%;
            margin:80px auto;
            background:white;
            padding:30px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h1{
            color:#04AA6D;
        }

        p{
            font-size:18px;
        }

        a{
            text-decoration:none;
        }

        button{
            background:#04AA6D;
            color:white;
            border:none;
            padding:12px 25px;
            font-size:18px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#038b5a;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Smart Lender</h1>

    <p>Loan Approval Prediction System</p>

    <a href="/predict">

</html>
