<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:60%;
            margin:auto;
            background:white;
            padding:20px;
            margin-top:20px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#04AA6D;
        }

        input,select{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:4px;
            box-sizing:border-box;
        }

        input[type=submit]{
            background:#04AA6D;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        input[type=submit]:hover{
            background:#038b5a;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Loan Approval Prediction</h2>

<form action="/submit" method="post">

<label>Gender</label>
<select name="Gender">
    <option value="1">Male</option>
    <option value="0">Female</option>
</select>

<label>Married</label>
<select name="Married">
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Dependents</label>
<input type="number" name="Dependents">

<label>Education</label>
<select name="Education">
    <option value="1">Graduate</option>
    <option value="0">Not Graduate</option>
</select>

<label>Self Employed</label>
<select name="Self_Employed">
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Applicant Income</label>
<input type="number" name="ApplicantIncome">

<label>Coapplicant Income</label>
<input type="number" name="CoapplicantIncome">

<label>Loan Amount</label>
<input type="number" name="LoanAmount">

<label>Loan Amount Term</label>
<input type="number" name="Loan_Amount_Term">

<label>Credit History</label>
<select name="Credit_History">
    <option value="1">Good</option>
    <option value="0">Bad</option>
</select>

<label>Property Area</label>
<select name="Property_Area">
    <option value="2">Urban</option>
    <option value="1">Semiurban</option>
    <option value="0">Rural</option>
</select>

<input type="submit" value="Predict Loan">

</form>

</div>

</body>
</html>
