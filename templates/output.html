<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction Result</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            text-align:center;
        }

        .container{
            width:50%;
            margin:auto;
            margin-top:80px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            color:#04AA6D;
        }

        h2{
            color:blue;
        }

        a{
            text-decoration:none;
        }

        button{
            background:#04AA6D;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#038b5a;
        }
    </style>

</head>

<body>

<div class="container">

<h1>Loan Prediction Result</h1>

<h2>{{ prediction_text }}</h2>

<br>

<a href="/">
    <button>Predict Again</button>
</a>

</div>

</body>
</html>
